<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#078f79">
  <meta name="description" content="Si MasDA — Sistem Manajemen MAS Darul Amin">
  <title>Si MasDA — Sistem Manajemen MAS Darul Amin</title>
  <style>
    :root { color-scheme: light; --brand:#078f79; --brand-dark:#087b70; --ink:#193064; }
    * { box-sizing:border-box; }
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#f3f6fb; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
    .app-shell { position:fixed; inset:0; width:100%; height:100%; background:#f3f6fb; }
    #gas-app { display:block; border:0; width:100%; height:100%; background:#f3f6fb; }
    .loading { position:absolute; inset:0; z-index:2; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:14px; color:var(--ink); background:linear-gradient(145deg,#f8fbff,#edf4fb); transition:opacity .35s ease, visibility .35s ease; }
    .loading.done { opacity:0; visibility:hidden; pointer-events:none; }
    .logo-mark { width:54px; height:54px; border-radius:17px; display:grid; place-items:center; color:#fff; font-weight:900; font-size:19px; letter-spacing:-1px; background:linear-gradient(135deg,#10b981,var(--brand-dark)); box-shadow:0 10px 26px #078f7933; }
    .loader { width:140px; height:4px; overflow:hidden; border-radius:9px; background:#dce7f1; }
    .loader::after { content:""; display:block; width:42%; height:100%; border-radius:9px; background:linear-gradient(90deg,#ffca28,#0d9d86); animation:loading 1.2s ease-in-out infinite; }
    .loading p { margin:0; font-size:13px; color:#71809b; }
    .fallback { display:none; position:absolute; left:16px; right:16px; bottom:16px; z-index:3; text-align:center; }
    .fallback a { display:inline-block; padding:11px 16px; border-radius:12px; color:#fff; background:var(--brand); font-weight:700; font-size:14px; text-decoration:none; box-shadow:0 8px 20px #078f7930; }
    @keyframes loading { 0%{ transform:translateX(-120%)} 100%{transform:translateX(350%)} }
    @media (prefers-reduced-motion:reduce) { .loader::after { animation:none; width:100%; } }
  </style>
</head>
<body>
  <main class="app-shell" aria-label="Aplikasi Si MasDA">
    <div class="loading" id="loading" role="status" aria-live="polite">
      <div class="logo-mark" aria-hidden="true">Si</div>
      <strong>Si MasDA</strong>
      <div class="loader" aria-hidden="true"></div>
      <p>Menyiapkan aplikasi…</p>
    </div>
    <iframe
      id="gas-app"
      title="Si MasDA — Sistem Manajemen MAS Darul Amin"
      src="https://script.google.com/macros/s/AKfycbzTgkhVHKKX8XtM9BPiwSapzJmUej-bIJcvbz0vh8w/exec"
      allow="camera; microphone; geolocation; fullscreen; autoplay"
      allowfullscreen
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
    <div class="fallback" id="fallback">
      <a href="https://script.google.com/macros/s/AKfycbzTgkhVHKKX8XtM9BPiwSapzJmUej-bIJcvbz0vh8w/exec" target="_blank" rel="noopener noreferrer">Buka Si MasDA di tab baru</a>
    </div>
  </main>
  <script>
    (function () {
      const frame = document.getElementById('gas-app');
      const loading = document.getElementById('loading');
      const fallback = document.getElementById('fallback');
      let loaded = false;
      const hideLoader = () => { loaded = true; loading.classList.add('done'); };
      frame.addEventListener('load', () => {
        hideLoader();
        // Load event does not guarantee that the Google deployment itself loaded successfully.
        // Keep a direct-open fallback available for login/permission restrictions.
        fallback.style.display = 'block';
        setTimeout(() => { fallback.style.display = 'none'; }, 9000);
      });
      setTimeout(() => {
        if (!loaded) {
          loading.classList.add('done');
          fallback.style.display = 'block';
        }
      }, 15000);
    })();
  </script>
</body>
</html>
